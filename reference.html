<!DOCTYPE html>
<html>
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Commissioner:wght@100..900&display=swap" rel="stylesheet">
    <style>
      body {
        background-color: #F9F9F9;
        margin: 0;
        padding: 0;
        font-family: 'Commissioner', sans-serif;
      }

      .navbar {
        background-color: #DA291C;
        padding: 15px 0;
        display: flex;
        justify-content: center;
        gap: 40px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      }
      
      .navbar a {
        color: #FFFFFF;
        text-decoration: none;
        font-weight: 700;
        text-transform: uppercase;
        font-size: 14px;
        letter-spacing: 1px;
        transition: 0.3s;
      }
      
      .navbar a:hover {
        color: #FBE122;
      }

      h1 {
        text-align: center;
        margin: 40px 0;
        color: #DA291C;
        text-transform: uppercase;
        font-weight: 900;
      }

      .div {
        background: #FFFFFF;
        width: 85%;
        border-radius: 25px;
        overflow: hidden;
        box-shadow: 0 10px 20px rgba(0,0,0,0.05);
        transition: all 0.3s ease;
        border-bottom: 6px solid #DA291C;
        margin: 30px auto;
        padding: 40px;
      }

      .image-row {
        display: flex;
        justify-content: center;
        gap: 20px;
        flex-wrap: wrap;
        margin-bottom: 30px;
      }

      .image-row img {
        height: 180px;
        width: auto;
        border-radius: 20px;
        transition: transform 0.3s ease;
      }

      .image-row img:hover {
        transform: scale(1.05);
      }

      .ref-links {
        text-align: center;
        line-height: 2.5;
      }

      .ref-links a {
        color: #DA291C;
        text-decoration: none;
        font-weight: 600;
        word-break: break-all;
        font-size: 1.1em;
        transition: color 0.2s;
      }

      .ref-links a:hover {
        color: #000000;
        text-decoration: underline;
      }

      p {
        color: #666;
        text-align: center;
        font-style: italic;
      }
    </style>
    <title>MUFC - References</title>
</head>
<body>

    <div class="navbar">
        <a href="WrapUpHome.html">Home</a>
        <a href="WrapUp2.html">The Theatre</a>
        <a href="WrapUp3.html">History</a>
        <a href="WrapUp4.html">Honours</a>
        <a href="reference.html">References</a>
    </div>

    <h1>Sources & Credits</h1>

    <div class="div">
        <div class="image-row">
            <img src="mufc_logo.png" alt="Manchester United Crest">
            <img src="old_trafford_exterior.jpg" alt="Aerial View of Old Trafford">
        </div>

        <div class="ref-links">
            <a href="https://www.manutd.com/en/club/history">https://www.manutd.com/en/club/history</a><br>
            
            <a href="https://en.wikipedia.org/wiki/Manchester_United_F.C._records_and_statistics">https://en.wikipedia.org/wiki/Manchester_United_F.C._records_and_statistics</a><br>
            
            <a href="https://www.premierleague.com/clubs/12/Manchester-United/overview">https://www.premierleague.com/clubs/12/Manchester-United/overview</a><br>
            
            <a href="https://en.wikipedia.org/wiki/Old_Trafford">https://en.wikipedia.org/wiki/Old_Trafford</a>
        </div>
</body>
</html>
